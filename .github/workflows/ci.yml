name: Java CI

on:
  push:
    branches: [ main ]
  


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java source
        run: |
          mkdir -p out
          javac -d out Main.java

      - name: Run application
        run: |
          java -cp out Main
      - name: Run custom Action
        id: java-action
        uses: ./actions/java-build
        with:
          src: Main.java
          main-class: Main

      - name: Show action input and output together
        env:
          INPUT_SRC: Main.java
          INPUT_MAIN_CLASS: Main
          ACTION_OUTPUT: ${{ steps.java-action.outputs.run-output }}
        run: |
          echo "Input src=$INPUT_SRC"
          echo "Input main-class=$INPUT_MAIN_CLASS"
          echo "Output=$ACTION_OUTPUT"
        

